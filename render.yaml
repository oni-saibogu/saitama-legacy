services:
  - type: web
    name: kamikaze
    runtime: docker
    plan: standard
    autoDeploy: true
    dockerfilePath: servers/kamikaze/Dockerfile
    buildFilter:
      paths:
        - servers/kamikaze/**/*.ts
        - servers/kamikaze/Dockerfile
        - packages/tsconfig/*.json
    envVars:
      - fromGroup: servers/kamikaze
      - key: DATABASE_URL
        fromDatabase:
          name: kamikazeDB
          property: connectionString
    domains:
      - "v1.api.gateway.saitama.fun"
databases:
  - name: kamikazeDB
    user: admin
    plan: starter
